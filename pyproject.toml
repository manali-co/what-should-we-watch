[project]
name = "wsww"
version = "0.0.0"
requires-python = ">=3.12"

[tool.uv.workspace]
members = ["services/api", "packages/*"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true
