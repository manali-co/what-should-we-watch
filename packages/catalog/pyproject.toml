[project]
name = "wsww-catalog"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "httpx>=0.27",
  "azure-cosmos>=4.7",
  "azure-identity>=1.17",
  "pydantic>=2.8",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6", "mypy>=1.11"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/wsww_catalog"]

[tool.pytest.ini_options]
pythonpath = ["src"]
