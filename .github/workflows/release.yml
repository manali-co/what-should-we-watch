name: Release

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write
  id-token: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      api_released: ${{ steps.rp.outputs['services/api--release_created'] }}
    steps:
      - uses: googleapis/release-please-action@v4
        id: rp
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  deploy-prod:
    needs: release-please
    if: ${{ needs.release-please.outputs.api_released == 'true' }}
    runs-on: ubuntu-latest
    environment: prod
    steps:
      - uses: actions/checkout@v4
      - uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - name: Provision infra
        run: |
          az group create -n rg-wsww-prod -l eastus2
          az deployment group create -g rg-wsww-prod \
            --template-file infra/main.bicep \
            --parameters infra/main.parameters.prod.json
      - uses: Azure/functions-action@v1
        with:
          app-name: wsww-prod-api
          package: services/api
          scm-do-build-during-deployment: true
          enable-oryx-build: true
