name: Deploy (dev)

on:
  push:
    branches: [dev]

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - name: Provision infra
        run: |
          az group create -n rg-wsww-dev -l eastus2
          az deployment group create -g rg-wsww-dev \
            --template-file infra/main.bicep \
            --parameters infra/main.parameters.dev.json
      - name: Install Azure Functions Core Tools
        run: |
          curl -fsSL https://packages.microsoft.com/keys/microsoft.asc | sudo gpg --dearmor -o /usr/share/keyrings/microsoft-prod.gpg
          sudo bash -c 'echo "deb [arch=amd64 signed-by=/usr/share/keyrings/microsoft-prod.gpg] https://packages.microsoft.com/ubuntu/$(lsb_release -rs)/prod $(lsb_release -cs) main" > /etc/apt/sources.list.d/microsoft-prod.list'
          sudo apt-get update
          sudo apt-get install -y azure-functions-core-tools-4
      - name: Deploy functions (Flex Consumption, remote build)
        working-directory: services/api
        run: func azure functionapp publish wsww-dev-api --python --build remote
