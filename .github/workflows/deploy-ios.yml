name: Deploy iOS (App Store)

# Promoting dev -> main is a deliberate, manual PR by the maintainer (the version in
# apps/mobile/app.json is bumped by hand as part of that PR). Merging to main then builds
# the app on EAS and auto-submits it to App Store Connect / TestFlight.
on:
  push:
    branches: [main]
    paths:
      - "apps/mobile/**"
      - ".github/workflows/deploy-ios.yml"
  workflow_dispatch: {}

# Least privilege: the deploy only reads the repo and talks to EAS via EXPO_TOKEN.
permissions:
  contents: read

concurrency:
  group: deploy-ios
  cancel-in-progress: false

jobs:
  build-submit:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: 20
      - name: Install EAS CLI
        run: npm install -g eas-cli@24.7.0
      - name: Install dependencies
        run: npm install --legacy-peer-deps --no-audit --no-fund
      - name: Build + submit to TestFlight
        # Queues the build on EAS (remote build number auto-increments) and auto-submits the
        # resulting .ipa to App Store Connect. --no-wait returns without blocking CI ~20 min;
        # the build + submit finish on EAS. Needs EXPO_TOKEN (repo secret) and an App Store
        # Connect API key stored in EAS credentials so the submit is non-interactive.
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: eas build --platform ios --profile production --auto-submit --non-interactive --no-wait
