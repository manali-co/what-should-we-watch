<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024"><defs><clipPath id="na"><circle cx="512" cy="400" r="290"/></clipPath><clipPath id="nb"><circle cx="633.2" cy="610" r="290"/></clipPath></defs>
<style>
.dA{animation:inA 1.1s cubic-bezier(.2,.7,.2,1) .1s both}
.dB{animation:inB 1.1s cubic-bezier(.2,.7,.2,1) .25s both}
.dC{animation:inC 1.1s cubic-bezier(.2,.7,.2,1) .4s both}
.ov{opacity:0;animation:show .6s ease-out 1.45s forwards}
@keyframes inA{from{transform:translate(0,-260px)}to{transform:none}}
@keyframes inB{from{transform:translate(240px,180px)}to{transform:none}}
@keyframes inC{from{transform:translate(-240px,180px)}to{transform:none}}
@keyframes show{to{opacity:1}}
@media (prefers-reduced-motion:reduce){.dA,.dB,.dC,.ov{animation:none;opacity:1;transform:none}}
</style><circle class="dA" cx="512" cy="400" r="290" fill="#E8796F" fill-opacity="1"/><circle class="dB" cx="633.2" cy="610" r="290" fill="#AE9BE0" fill-opacity="1"/><circle class="dC" cx="390.8" cy="610" r="290" fill="#4DBFB0" fill-opacity="1"/><g class="ov"><g clip-path="url(#na)"><circle cx="633.2" cy="610" r="290" fill="#9E4A62" fill-opacity="1"/><circle cx="390.8" cy="610" r="290" fill="#465B4D" fill-opacity="1"/></g><g clip-path="url(#nb)"><circle cx="390.8" cy="610" r="290" fill="#35749B" fill-opacity="1"/></g><g clip-path="url(#na)"><g clip-path="url(#nb)"><circle cx="390.8" cy="610" r="290" fill="#14151A" fill-opacity="1"/></g></g></g></svg>